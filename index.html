<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Management</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f7f6; }
        h1 { color: #333; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #007bff; color: white; }
        .form-container { background: white; padding: 20px; border-radius: 8px; max-width: 400px; }
        input { width: 90%; padding: 8px; margin: 8px 0; display: block; }
        button { background: #28a745; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; }
        button:hover { background: #218838; }
    </style>
</head>
<body>

    <h1>Student Directory</h1>

    <div class="form-container">
        <h3>Add New Student</h3>
        <input type="text" id="name" placeholder="Name">
        <input type="email" id="email" placeholder="Email">
        <input type="number" step="0.01" id="cgpa" placeholder="CGPA (0.0 - 4.0)">
        <button onclick="addStudent()">Add Student</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>CGPA</th>
            </tr>
        </thead>
        <tbody id="studentTable"></tbody>
    </table>

    <script>
        const API_URL = 'http://localhost:5229/api/students';

        // Load all students from API
        async function fetchStudents() {
            const res = await fetch(API_URL);
            const data = await res.json();
            const table = document.getElementById('studentTable');
            table.innerHTML = '';
            
            data.forEach(s => {
                table.innerHTML += `
                    <tr>
                        <td>${s.id}</td>
                        <td>${s.name}</td>
                        <td>${s.email}</td>
                        <td>${s.cgpa}</td>
                    </tr>`;
            });
        }

        // Send a POST request to add a new student
        async function addStudent() {
            const student = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                cgpa: parseFloat(document.getElementById('cgpa').value)
            };

            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(student)
            });

            if (res.ok) {
                alert('Student added successfully!');
                fetchStudents(); // Refresh the table
            } else {
                const err = await res.json();
                alert('Error: ' + JSON.stringify(err.errors));
            }
        }

        fetchStudents();
    </script>
</body>
</html>
